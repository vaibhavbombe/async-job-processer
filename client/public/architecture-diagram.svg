<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="300" fill="#0B0B0D"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3A3A40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Dashboard -->
  <rect x="30" y="110" width="150" height="60" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="105" y="135" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Dashboard</text>
  <text x="105" y="152" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="10">React + Chart.js</text>

  <!-- arrow: dashboard -> server -->
  <line x1="180" y1="140" x2="248" y2="140" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="214" y="130" text-anchor="middle" fill="#6B6B70" font-family="'JetBrains Mono', monospace" font-size="9">REST + Socket.io</text>

  <!-- Server + Worker box -->
  <rect x="250" y="80" width="200" height="140" rx="8" fill="#17171A" stroke="#FF6B45" stroke-width="1.5"/>
  <text x="350" y="105" text-anchor="middle" fill="#FF6B45" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">server.js (one process)</text>

  <rect x="270" y="120" width="70" height="40" rx="6" fill="#0B0B0D" stroke="#26262A"/>
  <text x="305" y="144" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="11">Express</text>

  <rect x="360" y="120" width="70" height="40" rx="6" fill="#0B0B0D" stroke="#26262A"/>
  <text x="395" y="144" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="11">Worker</text>

  <text x="350" y="196" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">retries + backoff</text>

  <!-- arrows: server -> redis / mongo -->
  <line x1="305" y1="220" x2="305" y2="250" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="395" y1="220" x2="395" y2="250" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Redis -->
  <rect x="230" y="250" width="150" height="40" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="305" y="274" text-anchor="middle" fill="#4AD3C9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Redis (queue)</text>

  <!-- MongoDB -->
  <rect x="380" y="250" width="150" height="40" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="455" y="274" text-anchor="middle" fill="#7C6FF0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MongoDB (history)</text>

  <!-- Bull Board -->
  <line x1="450" y1="120" x2="530" y2="120" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="95" width="140" height="50" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="600" y="118" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Bull Board</text>
  <text x="600" y="134" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">/admin/queues</text>
</svg>
